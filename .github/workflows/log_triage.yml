# Log triage: when an issue or a comment has an attached game.log, game-backup-*.log, crash log, RecompLauncher log or
# shader_seen.txt (a github.com/user-attachments/files/... link), tools/log_triage.py keeps one bot comment on the issue
# with a short summary of the newest logs (build, system, GPU, settings, how the run ended, frame rate, notable lines),
# a "log: crash" / "log: device-lost" / "log: ok" label, and, folded, the shader variant records the shipped list lacks
# with a "log: new shaders" label (tools/shader_collect.py gathers those into a pull request).
#
# Adapted from LAS Recomp's .github/workflows/log_triage.yml (https://github.com/peiikai/LASRecomp, MIT, Copyright (c)
# 2026 Peiikai, see LICENSE-LASRecomp).
#
# Security: no issue or comment text is ever put into this file's expressions or a shell. The script gets only the
# issue number (from the event, or the dispatch input, checked to be digits) and reads the issue itself through the
# API; logs are downloaded with a size cap from GitHub's attachment host only and only parsed. The default branch's
# script runs (a dispatch runs the dispatched branch's, for testing); no pull request code is ever checked out.
#
# Issue events only run this file from the default branch. workflow_dispatch (Actions tab or `gh workflow run`)
# tests it on any branch once the file is on the default branch: dry run (the default) prints the comment in the job
# log / summary and posts nothing.
name: Log triage
on:
  issues:
    types: [opened, edited]
  issue_comment:  # (edited too: a log attached by editing the comment just posted)
    types: [created, edited]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
        type: string
      dry_run:
        description: Print the comment instead of posting it
        type: boolean
        default: true
permissions:
  contents: read
  issues: write
concurrency:  # (one run per issue at a time, in order)
  group: log-triage-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  triage:
    # (issue_comment also fires on pull requests: skipped; bots' own comments too)
    if: github.event_name == 'workflow_dispatch' || ((github.event_name == 'issues' || github.event_name == 'issue_comment') &&
      !github.event.issue.pull_request && github.event.sender.type != 'Bot')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.repository.default_branch }}
          persist-credentials: false
          # (the script, the record shape it shares with the merge tool, and the shipped list it checks records against)
          sparse-checkout: |
            /tools/log_triage.py
            /tools/shader_list_merge.py
            /runtime/nvn/shader_variants.txt
          sparse-checkout-cone-mode: false
      - name: Summarise the attached logs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python3 -I tools/log_triage.py issue
