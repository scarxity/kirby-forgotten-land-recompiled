# CI for the Kirby and the Forgotten Land recomp. Adapted from LAS Recomp's .github/workflows/ci.yml
# (https://github.com/peiikai/LASRecomp, MIT, see LICENSE-LASRecomp): its Windows job (MSYS2 UCRT64, the packages
# tools/setup_windows.ps1 installs) and its tests that need no game files and no GPU.
#
# CI never sees the game: the repo holds none, so every check here runs on synthetic data. What needs the player's own
# extracted files (generator gate, service check, asset decode, shader sweep, stage tour) runs on a PC with
# `make verify GAME=<dump>`, see docs/testing.md. The checks themselves live in tools/ci/run.sh, so
# `make ci-test` runs what these jobs run.
#
# GitHub-hosted runners only, no secrets, nothing published (the linux job keeps its AppImage as a workflow artifact for
# seven days, to test it). Actions are pinned to full commit SHAs (checkout v6.1.0, cache v5.1.0, setup-node v6.5.0,
# setup-msys2 v2.33.0, upload-artifact v7.0.2).
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:  # (a newer push to the same branch / PR replaces a run still going)
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The runtime (everything but the game code, which the launcher builds on the player's PC from their own files) and
  # LAS Recomp's game-free tests, the shader translator's SPIR-V checks, the find-game test. None needs a GPU: the
  # Vulkan ones simulate the failures (a hosted runner has no driver), so no software ICD is installed.
  runtime:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      # MSYS2 UCRT64 with LAS Recomp's package list: clang and lld, binutils for windres (the exe's icon), SDL3, FFmpeg,
      # the Vulkan headers and shaderc / SPIRV-Tools (the translator tests), git for tools/test_translate.sh
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: make git python curl tar xz unzip
          pacboy: clang:p lld:p binutils:p python:p sdl3:p ffmpeg:p vulkan-devel:p shaderc:p spirv-tools:p pkgconf:p zstd:p
            vulkan-memory-allocator:p
      - name: Runtime builds
        run: bash tools/ci/run.sh build
      - name: Game-free tests
        if: ${{ !cancelled() }}
        run: bash tools/ci/run.sh engine

  # The Linux build (untested by play: docs/linux.md), in the container of tools/linux/Containerfile (Ubuntu 22.04, clang
  # 21): the dependencies from pinned sources (SDL3, the LGPL FFmpeg with its decoders checked, shaderc), the runtime, the
  # game-free tests that run on Linux (tools/ci/run.sh: the Windows-only ones and the ones that need glslc / spirv-val
  # are listed as SKIP), then the AppImage. The dependencies are cached: the first run builds shaderc, about half an hour.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: |
            build/linux/src
            build/linux/x86_64/deps
          key: linux-deps-${{ hashFiles('tools/linux/build_deps.sh', 'tools/linux/Containerfile') }}
      - name: Container image
        run: docker build -t forgottenland-build -f tools/linux/Containerfile tools/linux
      # (as the runner's own user, so the cache and the artifact are not root's)
      - name: Dependencies
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src forgottenland-build tools/linux/build_deps.sh x86_64
      - name: Runtime build and game-free tests
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e PY=python3.12 -v "$PWD:/src" -w /src forgottenland-build bash -c '
            P=$PWD/build/linux/x86_64/deps
            export CPATH=$P/include LIBRARY_PATH=$P/lib LD_LIBRARY_PATH=$P/lib PKG_CONFIG_PATH=$P/lib/pkgconfig
            export EXE=build/linux/x86_64/game/ForgottenLandRecomp
            export MAKEARGS="B=build/linux/x86_64/game DEPS=$P SHADERC=-lshaderc_shared"
            tools/ci/run.sh build engine'
      - name: AppImage
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src forgottenland-build bash -c '
            tools/linux/gen_helper.sh x86_64 && tools/linux/package.sh x86_64'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ForgottenLandRecomp-Linux-x86_64-AppImage
          path: build/dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

  # The launcher: its Rust side (cargo test) and its page (node's test runner, no npm packages needed).
  launcher:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: 22
      # (the runner's own Rust, the stable toolchain)
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            launcher/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('launcher/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: cargo test
        working-directory: launcher/src-tauri
        run: cargo test --locked
      - name: node --test
        working-directory: launcher
        run: node --test

  # Checks on the repo itself: no game data in the tree, the upstream sync tool, the generator's --dyn-base, and the
  # self-tests of whatever tools/verify holds. Git Bash and the runner's Python (the generator's packages as the
  # Makefile pins them, Windows wheels).
  repo:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Python packages
        run: python -m pip install capstone==5.0.9 unicorn==2.1.4 lz4==4.4.5
      - name: Repo checks
        run: bash tools/ci/run.sh repo
