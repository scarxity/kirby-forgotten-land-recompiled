name: Bug or performance problem
description: The game crashes, looks wrong, or stutters or runs slowly.
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Attaching the log is what lets us find the cause, and the shader file (for stutter) helps remove
        stutter for everyone. They hold no game files: the log names your GPU and driver, and the shader file only
        one-way hashes and draw settings. **Do not attach or paste any game files.**
  - type: dropdown
    id: kind
    attributes:
      label: What is wrong?
      options:
        - The game crashes or closes
        - Wrong picture (black screen, missing objects, glitches)
        - Stutter or low frame rate
        - Something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown on the launcher's About page, or in the zip's name.
      placeholder: "0.3.3"
    validations:
      required: true
  - type: dropdown
    id: launcher
    attributes:
      label: How did you start the game?
      options:
        - The launcher in the zip (ForgottenLandLauncher.exe)
        - RecompLauncher
        - Something else
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: Graphics card and driver version
      placeholder: "NVIDIA GeForce RTX 3050 Laptop GPU, driver 610.62"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and where in the game?
      description: What you did, what you saw, and what you expected. The stage or screen helps.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log files
      description: |
        Drag the files into this box. Attach **game.log** (always, or `crash-<date>-<time>.log` after a crash). For
        stutter or a low frame rate, also attach **cache\shader_seen.txt**.

        - The launcher in the zip: both are in the install folder (the folder with `ForgottenLandLauncher.exe`). The
          launcher's Settings > Game tab opens the game log.
        - RecompLauncher: `kirby-forgotten-land-recompiled.log` in `%APPDATA%\com.recomplauncher.app\game-output\`
          (paste the path into Explorer's address bar). `cache\shader_seen.txt` is in the game's install folder there too.

        If a file is too big, zip it. The log of the last run is replaced the next time you play, so attach it before
        playing again.
    validations:
      required: true
